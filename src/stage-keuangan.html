<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script>
// Panggung animasi tema keuangan & bisnis (motion graphics gelap, grafik, angka).
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, VERT, TL, MOUTH, FPS, DRAFT, U, INFO;
const EMOJI = '"Noto Color Emoji"';
const C = { bg1: '#0b1220', bg2: '#13203b', card: 'rgba(255,255,255,0.06)', line: 'rgba(255,255,255,0.08)', text: '#f8fafc', muted: '#94a3b8',
  green: '#22c55e', gold: '#fbbf24', blue: '#38bdf8', red: '#f87171', purple: '#a78bfa' };

window.setup = async (cfg) => {
  W = cv.width = cfg.width; H = cv.height = cfg.height;
  VERT = H > W; TL = cfg.timeline; MOUTH = cfg.mouth; FPS = cfg.fps; DRAFT = cfg.draft; INFO = cfg.info;
  U = Math.min(W, H) / 1080;
  for (const f of cfg.fonts) {
    const bin = Uint8Array.from(atob(f.b64), c => c.charCodeAt(0));
    const ff = new FontFace(f.family, bin.buffer, { weight: f.weight }); await ff.load(); document.fonts.add(ff);
  }
  ctx.font = `100px ${EMOJI}`; ctx.fillText('💰', -500, -500);
  await document.fonts.ready;
};
window.frame = (t, mode) => { draw(t, mode); return cv.toDataURL(mode === 'thumb' ? 'image/png' : 'image/jpeg', 0.9); };

// ---------- util ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const inout = x => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const col = c => C[c] || c || C.green;
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }

function fmt(v, f) {
  if (typeof v === 'string') return v;
  if (f === 'rp') return 'Rp' + Math.round(v).toLocaleString('id-ID');
  if (f === 'jt') return 'Rp' + (v / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt';
  if (f === 'persen') return Math.round(v) + '%';
  return Math.round(v).toLocaleString('id-ID');
}

function font(size, w = 700) { return `${w} ${size}px Inter, ${EMOJI}`; }
function text(str, x, y, size, color = C.text, o = {}) {
  ctx.save();
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.font = font(size, o.w); ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.maxW) { const m = ctx.measureText(str).width; if (m > o.maxW) { size *= o.maxW / m; ctx.font = font(size, o.w); } }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.restore();
  return size;
}
function wrap(str, x, y, maxW, size, color = C.text, o = {}) { // teks multi-baris, kembalikan tinggi
  ctx.save(); ctx.font = font(size, o.w); ctx.globalAlpha *= o.alpha ?? 1;
  const words = str.split(' '), rows = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { rows.push(cur); cur = w; } else cur = t; }
  rows.push(cur);
  ctx.fillStyle = color; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  const lh = size * 1.25;
  rows.forEach((r, i) => ctx.fillText(r, x, y + i * lh - (o.middle ? (rows.length - 1) * lh / 2 : 0)));
  ctx.restore();
  return rows.length * lh;
}
function emoji(e, x, y, size, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = '#000'; ctx.font = `${size}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y); ctx.restore();
}
function rrect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2 * U; ctx.stroke(); }
}
function pill(str, x, y, size, bg, fg = '#0b1220', align = 'center') {
  ctx.save(); ctx.font = font(size, 900);
  const w = ctx.measureText(str).width + size * 1.3, h = size * 1.8, x0 = align === 'left' ? x : x - w / 2;
  rrect(x0, y - h / 2, w, h, h / 2, bg);
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(str, x0 + w / 2, y + size * 0.05);
  ctx.restore(); return w;
}
// Waktu muncul tiap item: baris dengan "muncul": n memunculkan item sampai ke-n; tanpa itu, item ke-k muncul di baris ke-k.
function reveals(sc, n) {
  const T = new Array(n).fill(Infinity);
  if (sc.lines.some(l => l.muncul != null)) {
    let c = 0;
    for (const l of sc.lines) if (l.muncul != null) { for (let k = c; k < Math.min(n, l.muncul); k++) T[k] = l.start + (k - c) * 0.25; c = Math.max(c, l.muncul); }
  } else for (let k = 0; k < n; k++) { const l = sc.lines[Math.min(k, sc.lines.length - 1)]; T[k] = (l ? l.start : sc.start + 0.4) + Math.max(0, k - sc.lines.length + 1) * 0.4; }
  return T;
}
// animasi masuk: naik + memudar
function enter(t, t0, dy = 30) { const k = ease((t - t0) / 0.45); return { a: k, dy: (1 - k) * dy * U }; }

// ---------- latar ----------
function background(t, accent) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, C.bg1); g.addColorStop(1, C.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W * 0.8, H * 0.15, 0, W * 0.8, H * 0.15, W * 0.7);
  glow.addColorStop(0, accent + '22'); glow.addColorStop(1, accent + '00');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = C.line; ctx.lineWidth = 1;
  const step = 90 * U, off = (t * 8 * U) % step;
  for (let x = -off; x < W; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -off; y < H; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (let i = 0; i < 18; i++) { // partikel
    ctx.fillStyle = `rgba(255,255,255,${0.04 + hash(i) * 0.08})`;
    const x = hash(i + 3) * W, y = (hash(i + 9) * H - t * (6 + hash(i) * 12) * U + H * 20) % H;
    ctx.beginPath(); ctx.arc(x, y, (2 + hash(i + 5) * 5) * U, 0, 7); ctx.fill();
  }
}

// ---------- adegan ----------
function box() {
  return VERT ? { x: 70 * U, y: 330 * U, w: W - 140 * U, h: H - 330 * U - 480 * U }
              : { x: 130 * U, y: 190 * U, w: W - 260 * U, h: H - 190 * U - 170 * U };
}
function header(sc, t, B) {
  if (!sc.judul) return B;
  const e = enter(t, sc.start + 0.1);
  ctx.save(); ctx.globalAlpha = e.a;
  const s = text(sc.judul, VERT ? W / 2 : B.x, B.y + 20 * U + e.dy, (VERT ? 58 : 60) * U, C.text, { align: VERT ? 'center' : 'left', w: 900, maxW: B.w });
  ctx.fillStyle = col(sc.warna); const bw = 90 * U;
  ctx.fillRect(VERT ? W / 2 - bw / 2 : B.x, B.y + 20 * U + s * 0.75 + e.dy, bw * ease((t - sc.start - 0.3) / 0.5), 7 * U);
  ctx.restore();
  return { x: B.x, y: B.y + 120 * U, w: B.w, h: B.h - 120 * U };
}

const SCENES = {
  hook(sc, t, B) {
    const items = sc.items, T = reveals(sc, items.length), n = items.length;
    const size = (VERT ? 92 : 104) * U, lh = size * 1.35, y0 = B.y + B.h / 2 - (n - 1) * lh / 2;
    items.forEach((it, i) => {
      if (t < T[i]) return;
      const o = typeof it === 'string' ? { teks: it } : it, e = enter(t, T[i], 50);
      ctx.save(); ctx.globalAlpha = e.a;
      text(o.teks, W / 2, y0 + i * lh + e.dy, size, o.warna ? col(o.warna) : C.text, { w: 900, maxW: B.w });
      ctx.restore();
    });
    if (sc.ikon) emoji(sc.ikon, W / 2, B.y - (VERT ? 90 : 10) * U + Math.sin(t * 2) * 8 * U, 120 * U, ease((t - sc.start) / 0.5));
  },

  judul(sc, t, B) {
    const lt = t - sc.start, cy = B.y + B.h / 2;
    if (sc.ikon) emoji(sc.ikon, W / 2, cy - 200 * U + Math.sin(t * 2) * 8 * U, 150 * U, ease(lt / 0.5));
    const e1 = enter(t, sc.start + 0.15);
    ctx.save(); ctx.globalAlpha = e1.a; pill(sc.nomor || '', W / 2, cy - 50 * U + e1.dy, 34 * U, col(sc.warna)); ctx.restore();
    const e2 = enter(t, sc.start + 0.35, 40);
    ctx.save(); ctx.globalAlpha = e2.a; wrap(sc.judul_besar, W / 2, cy + 70 * U + e2.dy, B.w * 0.9, (VERT ? 84 : 96) * U, C.text, { w: 900 }); ctx.restore();
  },

  poin(sc, t, B) {
    B = header(sc, t, B);
    const items = sc.items, n = items.length, T = reveals(sc, n + (sc.total ? 1 : 0));
    const rowH = Math.min(118 * U, (B.h - (sc.total ? 130 * U : 0)) / n), size = Math.min(46 * U, rowH * 0.42);
    items.forEach((it, i) => {
      if (t < T[i]) return;
      const e = enter(t, T[i], 0), y = B.y + i * rowH, dx = (1 - e.a) * -60 * U;
      ctx.save(); ctx.globalAlpha = e.a;
      rrect(B.x + dx, y, B.w, rowH - 16 * U, 22 * U, C.card);
      ctx.fillStyle = col(it.warna || sc.warna); ctx.fillRect(B.x + dx, y + 18 * U, 7 * U, rowH - 52 * U);
      const cy = y + (rowH - 16 * U) / 2;
      if (it.ikon) emoji(it.ikon, B.x + dx + 70 * U, cy, size * 1.3);
      const tx = B.x + dx + (it.ikon ? 130 : 40) * U;
      text(it.teks, tx, cy, size, C.text, { align: 'left', maxW: B.w * (it.nilai != null ? 0.55 : 0.85) });
      if (it.nilai != null) text(fmt(it.nilai, sc.format), B.x + dx + B.w - 36 * U, cy, size, col(it.warna || sc.warna), { align: 'right', w: 900, maxW: B.w * 0.35 });
      ctx.restore();
    });
    if (sc.total && t >= T[n]) {
      const e = enter(t, T[n]), y = B.y + n * rowH + 20 * U + e.dy;
      ctx.save(); ctx.globalAlpha = e.a;
      ctx.fillStyle = C.line; ctx.fillRect(B.x, y - 10 * U, B.w, 3 * U);
      text(sc.total.teks, B.x + 40 * U, y + 45 * U, size * 1.1, C.muted, { align: 'left', w: 900 });
      text(fmt(sc.total.nilai, sc.format), B.x + B.w - 36 * U, y + 45 * U, size * 1.3, col(sc.total.warna || sc.warna), { align: 'right', w: 900 });
      ctx.restore();
    }
  },

  donut(sc, t, B) {
    B = header(sc, t, B);
    const items = sc.items, T = reveals(sc, items.length), sum = items.reduce((a, b) => a + b.nilai, 0);
    const R = Math.min(VERT ? B.w * 0.36 : B.h * 0.45, 330 * U);
    const cx = VERT ? W / 2 : B.x + B.w * 0.3, cy = VERT ? B.y + R + 10 * U : B.y + B.h / 2;
    ctx.lineWidth = R * 0.38;
    ctx.strokeStyle = C.card; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
    let a0 = -Math.PI / 2;
    items.forEach((it, i) => {
      const span = it.nilai / sum * Math.PI * 2, k = inout((t - T[i]) / 0.8);
      if (k > 0) { ctx.strokeStyle = col(it.warna); ctx.beginPath(); ctx.arc(cx, cy, R, a0, a0 + span * k - 0.015); ctx.stroke(); }
      if (k >= 1) { const m = a0 + span / 2; text(Math.round(it.nilai / sum * 100) + '%', cx + Math.cos(m) * R, cy + Math.sin(m) * R, R * 0.15, '#0b1220', { w: 900 }); }
      a0 += span;
    });
    if (sc.tengah) text(sc.tengah, cx, cy, R * 0.2, C.text, { w: 900, maxW: R * 1.1 });
    // legenda
    const lx = VERT ? B.x + 20 * U : B.x + B.w * 0.62, ly = VERT ? cy + R + 120 * U : cy - (items.length - 1) * 75 * U, gap = VERT ? 105 * U : 150 * U;
    items.forEach((it, i) => {
      if (t < T[i]) return;
      const e = enter(t, T[i] + 0.2), y = ly + i * gap + e.dy;
      ctx.save(); ctx.globalAlpha = e.a;
      ctx.fillStyle = col(it.warna); ctx.beginPath(); ctx.arc(lx + 18 * U, y, 16 * U, 0, 7); ctx.fill();
      text(it.label, lx + 55 * U, y - (it.sub ? 22 : 0) * U, 46 * U, C.text, { align: 'left', maxW: W - lx - 120 * U });
      if (it.sub) text(it.sub, lx + 55 * U, y + 32 * U, 36 * U, col(it.warna), { align: 'left', w: 900 });
      ctx.restore();
    });
  },

  batang(sc, t, B) {
    B = header(sc, t, B);
    const items = sc.items, n = items.length, T = reveals(sc, n), max = sc.maks || Math.max(...items.map(i => i.nilai));
    const top = B.y + 70 * U, base = B.y + B.h - 70 * U, slot = B.w / n, bw = Math.min(slot * 0.6, 220 * U);
    ctx.fillStyle = C.line; ctx.fillRect(B.x, base, B.w, 3 * U);
    items.forEach((it, i) => {
      const x = B.x + slot * (i + 0.5), k = inout((t - T[i]) / 0.9), h = (base - top) * it.nilai / max * k;
      text(it.label, x, base + 40 * U, 36 * U, C.muted, { maxW: slot * 0.95 });
      if (k <= 0) return;
      const g = ctx.createLinearGradient(0, base - h, 0, base); g.addColorStop(0, col(it.warna)); g.addColorStop(1, col(it.warna) + '66');
      rrect(x - bw / 2, base - h, bw, h, [14 * U, 14 * U, 0, 0], g);
      text(fmt(it.nilai * k, sc.format), x, base - h - 36 * U, 40 * U, C.text, { w: 900, maxW: slot * 0.98 });
    });
  },

  garis(sc, t, B) {
    B = header(sc, t, B);
    const series = sc.items, T = reveals(sc, series.length), xs = sc.x, n = xs.length;
    const max = sc.maks || Math.max(...series.flatMap(s => s.data)) * 1.1;
    const L = B.x + (VERT ? 120 : 150) * U, R = B.x + B.w - (VERT ? 40 : 230) * U, top = B.y + 30 * U, base = B.y + B.h - 60 * U;
    const px = i => L + (R - L) * i / (n - 1), py = v => base - (base - top) * v / max;
    for (let g = 0; g <= 4; g++) { // garis bantu
      const v = max * g / 4, y = py(v);
      ctx.fillStyle = C.line; ctx.fillRect(L, y, R - L, 2 * U);
      text(fmt(v, sc.format), L - 20 * U, y, 30 * U, C.muted, { align: 'right' });
    }
    xs.forEach((lab, i) => { if (i % Math.ceil(n / 6) === 0 || i === n - 1) text(String(lab), px(i), base + 40 * U, 32 * U, C.muted); });
    series.forEach((s, si) => {
      const k = inout((t - T[si]) / (sc.durasi_gambar || 3)); if (k <= 0) return;
      const upto = k * (n - 1), last = Math.floor(upto);
      ctx.strokeStyle = col(s.warna); ctx.lineWidth = 8 * U; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i <= last; i++) i ? ctx.lineTo(px(i), py(s.data[i])) : ctx.moveTo(px(i), py(s.data[i]));
      let ex = px(last), ey = py(s.data[last]);
      if (last < n - 1) { const f = upto - last; ex = px(last) + (px(last + 1) - px(last)) * f; ey = py(s.data[last] + (s.data[last + 1] - s.data[last]) * f); ctx.lineTo(ex, ey); }
      ctx.stroke();
      ctx.fillStyle = col(s.warna); ctx.beginPath(); ctx.arc(ex, ey, 13 * U, 0, 7); ctx.fill();
      const v = s.data[last] + (last < n - 1 ? (s.data[last + 1] - s.data[last]) * (upto - last) : 0);
      const lblX = VERT ? Math.min(ex, R - 10 * U) : ex + 24 * U;
      text(fmt(v, sc.format), lblX, ey - (VERT ? 45 : 0) * U - (si % 2 && VERT ? -90 * U : 0), 40 * U, col(s.warna), { align: VERT ? 'right' : 'left', w: 900 });
      // legenda
      const ly = B.y - 10 * U + si * 50 * U;
      ctx.fillStyle = col(s.warna); ctx.fillRect(L + 20 * U, ly - 4 * U, 40 * U, 8 * U);
      text(s.label, L + 75 * U, ly, 32 * U, C.text, { align: 'left' });
    });
  },

  angka(sc, t, B) {
    const T = [sc.lines[0].start + 0.2, reveals(sc, 2)[1]], cy = B.y + B.h / 2;
    const e0 = enter(t, sc.start + 0.1);
    ctx.save(); ctx.globalAlpha = e0.a; wrap(sc.label || '', W / 2, cy - 170 * U + e0.dy, B.w, 52 * U, C.muted, { w: 700, middle: true }); ctx.restore();
    const k = inout((t - T[0]) / (sc.durasi_hitung || 1.6));
    if (t >= T[0]) {
      const pulse = 1 + 0.04 * Math.max(0, 1 - Math.abs(t - T[0] - (sc.durasi_hitung || 1.6)) * 4);
      ctx.save(); ctx.translate(W / 2, cy); ctx.scale(pulse, pulse);
      text(fmt(sc.nilai * k, sc.format), 0, 0, (VERT ? 150 : 190) * U, col(sc.warna), { w: 900, maxW: B.w });
      ctx.restore();
    }
    if (sc.catatan && t >= T[1]) { const e = enter(t, T[1]); ctx.save(); ctx.globalAlpha = e.a; wrap(sc.catatan, W / 2, cy + 170 * U + e.dy, B.w * 0.9, 46 * U, C.text, { w: 700 }); ctx.restore(); }
  },

  banding(sc, t, B) {
    B = header(sc, t, B);
    const rows = sc.items, n = rows.length, T = reveals(sc, n), gap = 30 * U, cw = (B.w - gap) / 2;
    const rowH = Math.min(110 * U, (B.h - 120 * U) / n), size = Math.min(VERT ? 32 * U : 38 * U, rowH * 0.36);
    [sc.kiri, sc.kanan].forEach((side, s) => {
      const x = B.x + s * (cw + gap), c = col(side.warna), e = enter(t, sc.start + 0.2 + s * 0.15);
      ctx.save(); ctx.globalAlpha = e.a;
      rrect(x, B.y + e.dy, cw, B.h, 26 * U, C.card, c + '55');
      text((side.ikon ? side.ikon + '  ' : '') + side.judul, x + cw / 2, B.y + 60 * U + e.dy, (VERT ? 42 : 50) * U, c, { w: 900, maxW: cw * 0.9 });
      ctx.restore();
    });
    rows.forEach((r, i) => {
      if (t < T[i]) return;
      const e = enter(t, T[i], 20), y = B.y + 130 * U + i * rowH + rowH / 2 + e.dy;
      ctx.save(); ctx.globalAlpha = e.a;
      [r.kiri, r.kanan].forEach((str, s) => wrap(str, B.x + s * (cw + gap) + cw / 2, y, cw * 0.92, size, C.text, { middle: true }));
      ctx.restore();
    });
  },

  rumus(sc, t, B) {
    B = header(sc, t, B);
    const rows = sc.items, n = rows.length, T = reveals(sc, n);
    const rowH = Math.min(130 * U, B.h / n), size = Math.min(VERT ? 44 * U : 54 * U, rowH * 0.42);
    rows.forEach((r, i) => {
      if (t < T[i]) return;
      const e = enter(t, T[i]), y = B.y + i * rowH + rowH / 2 + e.dy;
      ctx.save(); ctx.globalAlpha = e.a;
      if (VERT) {
        text(r.teks, W / 2, y - size * 0.6, size * 0.85, C.text, { maxW: B.w });
        const k = ease((t - T[i] - 0.4) / 0.4); ctx.globalAlpha = e.a * k;
        text(r.hasil || '', W / 2, y + size * 0.6, size, col(r.warna || sc.warna), { w: 900, maxW: B.w });
      } else {
        text(r.teks, B.x + 20 * U, y, size, C.text, { align: 'left', maxW: B.w * 0.58 });
        const k = ease((t - T[i] - 0.4) / 0.4); ctx.globalAlpha = e.a * k;
        text(r.hasil || '', B.x + B.w - 20 * U, y, size, col(r.warna || sc.warna), { align: 'right', w: 900, maxW: B.w * 0.4 });
      }
      ctx.restore();
    });
  },

  penutup(sc, t, B) {
    B = header(sc, t, B);
    const items = sc.items || [], T = reveals(sc, items.length), rowH = Math.min(110 * U, B.h / Math.max(1, items.length));
    items.forEach((s, i) => {
      if (t < T[i]) return;
      const e = enter(t, T[i]), y = B.y + i * rowH + rowH / 2 + e.dy;
      ctx.save(); ctx.globalAlpha = e.a;
      emoji('✅', B.x + 40 * U, y, 52 * U);
      text(s, B.x + 100 * U, y, (VERT ? 40 : 48) * U, C.text, { align: 'left', maxW: B.w - 120 * U });
      ctx.restore();
    });
  },
};

// ---------- lapisan tetap ----------
function chrome(sc, t) {
  let bab = null;
  for (const s of TL.scenes) { if (s.start > t) break; if (s.bab) bab = s.bab; }
  const topY = VERT ? 200 * U : 80 * U;
  if (bab) { ctx.save(); ctx.globalAlpha = 0.95; pill(bab, VERT ? W / 2 - 0 : 130 * U, topY, 26 * U, 'rgba(255,255,255,0.12)', C.text, VERT ? 'center' : 'left'); ctx.restore(); }
  if (INFO.channel && !VERT) text(INFO.channel, W - 130 * U, topY, 28 * U, C.muted, { align: 'right', w: 900 });
  if (!VERT) { // progress
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, H - 8 * U, W, 8 * U);
    ctx.fillStyle = col(sc.warna); ctx.fillRect(0, H - 8 * U, W * t / INFO.total, 8 * U);
  }
  // indikator narator (berdenyut mengikuti suara)
  const m = MOUTH[Math.min(MOUTH.length - 1, Math.round(t * FPS))] || 0;
  const nx = VERT ? W / 2 : 70 * U, ny = VERT ? H - 380 * U : H - 80 * U;
  if (!VERT) {
    ctx.strokeStyle = col(sc.warna) + '88'; ctx.lineWidth = 4 * U;
    for (let i = 0; i < 5; i++) { const h = (8 + m * 34 * (0.5 + hash(i + Math.floor(t * 12)) * 0.5)) * U; ctx.beginPath(); ctx.moveTo(nx + (i - 2) * 12 * U, ny - h / 2); ctx.lineTo(nx + (i - 2) * 12 * U, ny + h / 2); ctx.stroke(); }
  }
  if (sc.catatan_kecil) text(sc.catatan_kecil, W / 2, VERT ? H - 420 * U : H - 60 * U, 26 * U, C.muted, { maxW: W * 0.8, w: 700 });
}

function draw(t, mode) {
  const sc = TL.scenes.find(s => t >= s.start && t < s.end) || TL.scenes[TL.scenes.length - 1];
  background(t, col(sc.warna));
  if (mode === 'thumb') return thumb();
  const B = box();
  ctx.save();
  const k = ease((t - sc.start) / 0.35); ctx.globalAlpha = k;
  SCENES[sc.type](sc, t, B);
  ctx.restore();
  chrome(sc, t);
  if (DRAFT) {
    const ln = sc.lines.find(l => t >= l.start && t < l.end + 0.3);
    if (ln) { ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, H - 110 * U, W, 60 * U); text(ln.text, W / 2, H - 80 * U, 30 * U, '#fff', { maxW: W * 0.95 }); }
  }
}

function thumb() {
  const th = TL.thumbnail, c = col(th.warna);
  const g = ctx.createRadialGradient(W * 0.78, H * 0.5, 0, W * 0.78, H * 0.5, W * 0.5);
  g.addColorStop(0, c + '66'); g.addColorStop(1, c + '00'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  th.baris.forEach((b, i) => {
    const o = typeof b === 'string' ? { teks: b } : b;
    text(o.teks, 70 * U, H * 0.22 + i * 190 * U, 170 * U, o.warna ? col(o.warna) : '#ffffff', { align: 'left', w: 900, maxW: W * 0.6 });
  });
  if (th.sorot) { ctx.save(); ctx.translate(W * 0.77, H * 0.78); ctx.rotate(-0.06); pill(th.sorot, 0, 0, 64 * U, c); ctx.restore(); }
  (th.emojis || []).forEach((e, i) => emoji(e, W * (0.78 + (i - (th.emojis.length - 1) / 2) * 0.13), H * 0.42 + (i % 2) * 40 * U, 260 * U));
}
